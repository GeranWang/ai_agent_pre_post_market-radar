[project]
name = "premarket-radar"
version = "0.1.0"
description = "A daily, holdings-driven US market brief delivered by email"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "yfinance>=0.2.48",
    "rich>=13.9.0",
    "mrml>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
